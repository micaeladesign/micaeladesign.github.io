<svg class="zoom-svg gorra-svg" viewBox="0 0 1305 1206" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs>
  <!-- Puntada satinada: hilos finos en diagonal, con luz y sombra -->
  <pattern id="gorra-satin" patternUnits="userSpaceOnUse" width="2.4" height="2.4" patternTransform="rotate(68)">
    <rect width="2.4" height="2.4" fill="#7B2F90" />
    <rect width="1.3" height="2.4" fill="#A257B8" />
    <rect x="0.35" width="0.45" height="2.4" fill="#C489D4" opacity="0.7" />
  </pattern>
  <filter id="gorra-thread" x="-5%" y="-30%" width="110%" height="160%">
    <feDropShadow dx="0.6" dy="1.4" stdDeviation="0.9" flood-color="#000" flood-opacity="0.75" />
  </filter>
  <!-- Curva suave que sigue el frente de la gorra -->
  <path id="gorra-line" d="M 474 602 Q 636 618 798 598" />
</defs>

<!-- La gorra con Batatita bordada -->
<image href="fondo/assets/gorra.webp" x="0" y="0" width="1305" height="1206" />

<!-- "sobre barro y arena", bordado en imprenta debajo de Batatita -->
<text class="gorra-phrase" filter="url(#gorra-thread)">
  <textPath href="#gorra-line" startOffset="50%">sobre barro y arena</textPath>
</text>
</svg>
